<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="BRICK-BREAKER.png">
<title>Retro Brick Breaker - Ultimate Edition</title>
<style>
:root{--bg-color:#0d0e15;--panel-color:#1a1c29;--accent-color:#00ffcc;--text-color:#ffffff;--text-muted:#8892b0;--primary-btn:#00ffcc;--danger-btn:#ff4a5a;--border-color:#2d3142;}*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;}html,body{width:100%;height:100%;overflow:hidden;background:var(--bg-color);}body{color:var(--text-color);font-family:"Courier New",Courier,monospace,"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:center;position:fixed;inset:0;touch-action:none;}#game-container{position:relative;width:800px;height:600px;background:#000;border:4px solid #333;box-shadow:0 0 30px rgba(0,255,204,0.1);overflow:hidden;touch-action:none;flex-shrink:0;}.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:30px;background:var(--bg-color);z-index:10;}.screen.active{display:flex;}#home-screen{display:grid;grid-template-columns:240px 1fr;gap:20px;}.sidebar{background:var(--panel-color);border:2px solid var(--border-color);border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;}.main-panel{display:flex;flex-direction:column;gap:20px;overflow-y:auto;}.game-title{color:var(--accent-color);font-size:24px;font-weight:bold;line-height:1.1;letter-spacing:2px;text-align:center;text-shadow:0 0 10px rgba(0,255,204,0.5);margin-bottom:20px;}.stats-group{margin-bottom:20px;}.stats-title{color:var(--text-muted);font-size:12px;text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--border-color);}.stat-item{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}.stat-val{color:var(--accent-color);font-weight:bold;}.sidebar-btn{background:transparent;border:2px solid var(--border-color);color:var(--text-color);padding:10px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:bold;transition:0.2s;}.sidebar-btn:hover{border-color:var(--accent-color);color:var(--accent-color);box-shadow:0 0 10px rgba(0,255,204,0.2);}.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;}.stage-card{position:relative;min-height:120px;padding:12px;background:var(--panel-color);border:2px solid var(--border-color);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:0.2s;}.stage-card:hover:not(.locked){border-color:var(--accent-color);transform:translateY(-2px);box-shadow:0 5px 15px rgba(0,255,204,0.15);}.stage-card.locked{opacity:0.4;cursor:not-allowed;background:#11121a;}.stage-num{font-size:24px;font-weight:bold;margin-bottom:3px;}.stage-name{color:var(--text-muted);font-size:11px;text-align:center;}.stage-description{color:var(--text-muted);font-size:9px;line-height:1.2;text-align:center;margin-top:6px;}.stage-badge{position:absolute;top:6px;right:6px;color:var(--text-color);background:var(--border-color);font-size:9px;padding:2px 5px;border-radius:4px;}.stage-card.cleared .stage-badge{color:#000;background:#ffd700;font-weight:bold;}#game-screen{padding:0;background:transparent;}#gameCanvas{display:block;width:100%;height:100%;background:#05050a;touch-action:none;}.hud-overlay{position:absolute;top:15px;right:15px;display:none;gap:10px;z-index:20;}.hud-btn{width:36px;height:36px;background:rgba(26,28,41,0.85);border:1px solid var(--border-color);border-radius:6px;color:var(--text-color);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}.hud-btn:hover{color:var(--accent-color);border-color:var(--accent-color);}.modal-layer{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(13,14,21,0.85);backdrop-filter:blur(4px);}.modal-layer.active{display:flex;}.modal-content{width:360px;max-width:calc(100% - 30px);padding:30px;display:flex;flex-direction:column;gap:20px;background:var(--panel-color);border:2px solid var(--border-color);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.5);}.modal-title{color:var(--accent-color);font-size:22px;font-weight:bold;text-align:center;letter-spacing:1px;}.msg-text{color:var(--text-color);font-size:14px;line-height:1.5;text-align:center;}.highlight{color:var(--accent-color);font-weight:bold;}.config-row{display:flex;flex-direction:column;gap:8px;}.config-label{display:flex;justify-content:space-between;color:var(--text-muted);font-size:13px;}.config-row input[type="range"]{width:100%;height:6px;appearance:none;background:var(--border-color);border-radius:3px;outline:none;}.config-row input[type="range"]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;background:var(--accent-color);border-radius:50%;cursor:pointer;box-shadow:0 0 8px var(--accent-color);}.toggle-container{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}input[type="checkbox"]{display:none;}.checkbox-custom{position:relative;width:40px;height:20px;background:var(--border-color);border-radius:10px;transition:0.2s;}.checkbox-custom::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;background:#fff;border-radius:50%;transition:0.2s;}input[type="checkbox"]:checked + .checkbox-custom{background:var(--accent-color);}input[type="checkbox"]:checked + .checkbox-custom::after{transform:translateX(20px);}.menu-btn{background:transparent;border:2px solid var(--primary-btn);color:var(--primary-btn);padding:12px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:bold;text-align:center;text-transform:uppercase;transition:0.2s;}.menu-btn:hover{background:var(--primary-btn);color:#000;box-shadow:0 0 15px rgba(0,255,204,0.4);}.menu-btn.danger{border-color:var(--danger-btn);color:var(--danger-btn);}.menu-btn.danger:hover{background:var(--danger-btn);color:#fff;box-shadow:0 0 15px rgba(255,74,90,0.4);}

/* スマホ用発射ボタン */
#btn-launch-mobile {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 76px;
  height: 76px;
  background: rgba(0, 255, 204, 0.2);
  border: 2px solid var(--accent-color);
  color: var(--accent-color);
  border-radius: 50%;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 25;
  box-shadow: 0 0 15px rgba(0,255,204,0.3);
  backdrop-filter: blur(4px);
  cursor: pointer;
}
#btn-launch-mobile:active {
  background: var(--accent-color);
  color: #000;
  transform: scale(0.95);
}

/* 縦向き時の注意書きオーバーレイ */
#rotate-warning {
  position: fixed;
  inset: 0;
  background: rgba(13, 14, 21, 0.95);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 16px;
  color: var(--text-color);
  font-family: inherit;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
#rotate-warning.show {
  opacity: 1;
  pointer-events: auto;
}
.rotate-icon {
  font-size: 48px;
  animation: rotateAnim 2s infinite ease-in-out;
}
@keyframes rotateAnim {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}

/* レスポンシブ：アスペクト比 4:3 (800x600) を維持 */
@media (max-width: 820px), (max-height: 620px) {
  #game-container {
    width: 100vw;
    height: calc(100vw * (600 / 800));
    max-height: 100vh;
    max-width: calc(100vh * (800 / 600));
    border-width: 2px;
  }
  .screen { padding: 15px; }
  #home-screen { grid-template-columns: 170px 1fr; gap: 10px; }
  .sidebar { padding: 12px; }
  .game-title { font-size: 18px; }
  .stage-grid { grid-template-columns: repeat(2,1fr); gap: 10px; }
  .stage-card { min-height: 100px; padding: 10px; }
}

/* スマホ用レイアウト */
@media (hover: none) and (pointer: coarse) and (max-width: 820px) {
  #home-screen { display: flex !important; flex-direction: column; overflow-y: auto; }
  .sidebar { flex-shrink: 0; }
  .main-panel { overflow: visible; }
  .game-title { margin-bottom: 10px; }
  .stats-group { margin-bottom: 10px; }
  .sidebar > div:last-child { flex-direction: row !important; }
  .sidebar-btn { flex: 1; font-size: 11px; }
  .stage-grid { grid-template-columns: repeat(2,1fr); }
  .hud-overlay { top: 8px; right: 8px; }
  .hud-btn { width: 34px; height: 34px; }
  #btn-launch-mobile { display: flex; }
}

@media (hover: none) and (pointer: coarse) and (max-width: 380px) {
  .stage-grid { grid-template-columns: 1fr; }
  .stage-card { min-height: 90px; }
}
</style>
</head>
<body>

<div id="rotate-warning">
  <div class="rotate-icon">📱</div>
  <div style="font-size:18px; font-weight:bold; color:var(--accent-color);">スマホを横向きにしてください</div>
  <div style="font-size:12px; color:var(--text-muted); text-align:center; padding:0 20px;">このゲームは横画面プレイに最適化されています</div>
</div>

<div id="game-container">
<div id="hud-overlay" class="hud-overlay">
<button id="btn-hud-config" class="hud-btn" title="設定">⚙️</button>
<button id="btn-hud-pause" class="hud-btn" title="一時停止">⏸</button>
</div>
<button id="btn-launch-mobile">発射</button>

<section id="home-screen" class="screen active">
<aside class="sidebar">
<div>
<div class="game-title">BRICK<br>BREAKER</div>
<div class="stats-group">
<div class="stats-title">PLAYER STATS</div>
<div class="stat-item"><span>最高スコア</span><span id="stat-high-score" class="stat-val">0</span></div>
<div class="stat-item"><span>解放ステージ</span><span id="stat-unlocked" class="stat-val">1/20</span></div>
<div class="stat-item"><span>クリア回数</span><span id="stat-cleared-count" class="stat-val">0</span></div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<button id="btn-home-config" class="sidebar-btn">⚙️ オーディオ設定</button>
<button id="btn-reset-data" class="sidebar-btn" style="border-color:#444;color:#aaa;">データ初期化</button>
</div>
</aside>
<main class="main-panel">
<div style="border-bottom:2px solid var(--border-color);padding-bottom:10px;margin-bottom:10px;">
<h2 style="font-size:18px;letter-spacing:1px;">STAGE SELECT</h2>
<p style="font-size:11px;color:var(--text-muted);margin-top:4px;">ステージをクリアすると次のステージが解放されます。（全20ステージ）</p>
</div>
<div id="stage-grid-container" class="stage-grid"></div>
</main>
</section>
<section id="game-screen" class="screen">
<canvas id="gameCanvas" width="800" height="600"></canvas>
</section>
<div id="modal-pause" class="modal-layer">
<div class="modal-content">
<div class="modal-title">PAUSED</div>
<div class="msg-text">ゲームは一時停止状態です。</div>
<button id="btn-pause-resume" class="menu-btn">ゲームに戻る</button>
<button id="btn-pause-retire" class="menu-btn danger">リタイアする</button>
</div>
</div>
<div id="modal-config" class="modal-layer">
<div class="modal-content">
<div class="modal-title">SETTINGS</div>
<div class="config-row">
<div class="config-label"><span>BGM 音量</span><span id="val-bgm-volume">50%</span></div>
<input id="slider-bgm" type="range" min="0" max="100" value="50">
</div>
<div class="config-row">
<div class="config-label"><span>SE 音量</span><span id="val-se-volume">70%</span></div>
<input id="slider-se" type="range" min="0" max="100" value="70">
</div>
<div class="config-row">
<label class="toggle-container">
<span style="font-size:13px;color:var(--text-muted);">画面の振動エフェクト</span>
<span><input id="chk-shake" type="checkbox" checked><span class="checkbox-custom"></span></span>
</label>
</div>
<button id="btn-config-close" class="menu-btn">閉じる</button>
</div>
</div>
<div id="modal-result" class="modal-layer">
<div class="modal-content">
<div id="result-title" class="modal-title">STAGE CLEAR</div>
<div id="result-text" class="msg-text"></div>
<button id="btn-result-action" class="menu-btn">次のステージへ</button>
<button id="btn-result-home" class="sidebar-btn">ホームに戻る</button>
</div>
</div>
</div>

<script>
"use strict";
const GAME_WIDTH = 800;
const GAME_HEIGHT = 600;
const SAVE_KEY = "retro_brick_breaker_save_v5";
const COLORS = { accent: "#00ffcc", white: "#ffffff", danger: "#ff4a5a", pink: "#ff00aa", yellow: "#ffff00", purple: "#aa00ff", blue: "#00bfff", gold: "#ffd700", dark: "#111119" };

const STAGES = {
  1: { name: "NORMAL FIELD", rows: 4, cols: 9, description: "基本のブロック配置。操作に慣れよう。" },
  2: { name: "DURABLE WALL", rows: 5, cols: 9, description: "2回叩かないと壊れない頑丈なブロック。" },
  3: { name: "SPEED BOOSTER", rows: 5, cols: 9, description: "黄色ブロックを壊すとボールが一時的に高速化。" },
  4: { name: "HIDDEN LAYER", rows: 6, cols: 9, description: "耐久値3の紫ブロック。レーザーを活用しよう。" },
  5: { name: "PYRAMID PEAK", rows: 5, cols: 9, description: "ピラミッド状にそびえ立つ罠の配置。" },
  6: { name: "ZIGZAG MAZE", rows: 6, cols: 9, description: "ジグザグに配置された特殊ブロックの壁。" },
  7: { name: "HARDCORE ZONE", rows: 6, cols: 9, description: "耐久力の高いブロックが密集するエリア。" },
  8: { name: "SPEED HELL", rows: 6, cols: 9, description: "スピードアップブロックが大量に潜む難所。" },
  9: { name: "FORTRESS", rows: 6, cols: 9, description: "幾重にも重なる要塞のようなブロック群。" },
  10: { name: "FINAL CASTLE", rows: 6, cols: 9, description: "全種類の特殊ブロックが登場する要塞関門。" },
  11: { name: "RANDOM HELL", rows: 6, cols: 9, description: "【ランダム】配置も耐久も毎回変わるステージ！" },
  12: { name: "OPEN SKY", rows: 5, cols: 9, description: "【解放】天井を抜けても安心な開放フィールド。" },
  13: { name: "LASER LAB", rows: 6, cols: 9, description: "【研究所】レーザーとテクニックで崩す実験場。" },
  14: { name: "DIAMOND RING", rows: 6, cols: 9, description: "【ダイヤ】高得点ゴールドが散りばめられた配置。" },
  15: { name: "VOID CORRIDOR", rows: 6, cols: 9, description: "【暗闇】ボールが当たると視界が暗くなるブラインド地帯。" },
  16: { name: "GOLDEN RUSH", rows: 6, cols: 9, description: "【ゴールド】高得点ブロックが並ぶスペシャル面。" },
  17: { name: "MAZE OF PAIN", rows: 6, cols: 9, description: "【迷宮】難所が入り組む複雑な立体ゾーン。" },
  18: { name: "TITAN FORT", rows: 6, cols: 9, description: "【巨壁】高耐久ブロックが隙間なく並ぶ超巨壁。" },
  19: { name: "CRYSTAL TOWER", rows: 6, cols: 9, description: "【水晶】宝石のように輝く美しき高難度タワー。" },
  20: { name: "VOID APOCALYPSE", rows: 6, cols: 9, description: "【終焉】すべてのギミックが牙をむく最終試練！" }
};

const TOTAL_STAGES = 20;
const $ = id => document.getElementById(id);
const DOM = {
  container: $("game-container"),
  canvas: $("gameCanvas"),
  home: $("home-screen"),
  game: $("game-screen"),
  hud: $("hud-overlay"),
  stageGrid: $("stage-grid-container"),
  highScore: $("stat-high-score"),
  unlocked: $("stat-unlocked"),
  clearedCount: $("stat-cleared-count"),
  pauseModal: $("modal-pause"),
  configModal: $("modal-config"),
  resultModal: $("modal-result"),
  resultTitle: $("result-title"),
  resultText: $("result-text"),
  resultAction: $("btn-result-action"),
  sliderBgm: $("slider-bgm"),
  sliderSe: $("slider-se"),
  bgmValue: $("val-bgm-volume"),
  seValue: $("val-se-volume"),
  shake: $("chk-shake")
};

const ctx = DOM.canvas.getContext("2d");
const state = { highScore: 0, unlockedStage: 1, clearedCount: 0, currentStage: 1, score: 0, lives: 3, playing: false, paused: false, screenShake: 0, configSource: "home", lastTime: 0, blindTimer: 0, flashTimer: 0 };
const paddle = { x: 350, y: 550, width: 100, baseWidth: 100, height: 15, speed: 600, laserTimer: 0 };
const activeBuffs = { expand: 0, expandMax: 0, laser: 0, laserMax: 0 };
let balls = [];
let bricks = [];
let items = [];
let particles = [];
let floatingTexts = [];
let lasers = [];
let stickyBall = true;
const input = { left: false, right: false, pointerActive: false, pointerX: GAME_WIDTH / 2, keyboardActive: false };

class SoundEngine {
  constructor() { this.ctx = null; this.bgmGain = null; this.seGain = null; this.bgmInterval = null; this.bgmVolume = 0.5; this.seVolume = 0.7; this.bgmStep = 0; this.playingBGM = false; }
  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      this.ctx = new AudioContext();
      this.bgmGain = this.ctx.createGain();
      this.seGain = this.ctx.createGain();
      this.bgmGain.connect(this.ctx.destination);
      this.seGain.connect(this.ctx.destination);
      this.updateVolumes();
    }
    if (this.ctx.state === "suspended") { this.ctx.resume(); }
  }
  updateVolumes() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    this.bgmGain.gain.setValueAtTime(Math.max(0, Math.min(1, this.bgmVolume)), now);
    this.seGain.gain.setValueAtTime(Math.max(0, Math.min(1, this.seVolume)), now);
  }
  setBGMVolume(v) { this.bgmVolume = v; this.updateVolumes(); }
  setSEVolume(v) { this.seVolume = v; this.updateVolumes(); }
  tone(frequency, type, duration, isSE = true, pitchSlide = 0) {
    this.init();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      const output = isSE ? this.seGain : this.bgmGain;
      const now = this.ctx.currentTime;
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, now);
      if (pitchSlide !== 0) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, frequency + pitchSlide), now + duration);
      }
      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      osc.connect(gain);
      gain.connect(output);
      osc.start(now);
      osc.stop(now + duration);
    } catch (e) { console.warn("Audio error:", e); }
  }
  playSE(type) {
    this.init();
    switch (type) {
      case "bounce": this.tone(360, "sine", 0.06, true, 80); break;
      case "paddle": this.tone(520, "triangle", 0.09, true, 150); break;
      case "break":
        this.tone(440, "square", 0.1, true, -200);
        setTimeout(() => this.tone(880, "sine", 0.08, true, 0), 30);
        break;
      case "break_hard":
        this.tone(130, "sawtooth", 0.2, true, -80);
        setTimeout(() => this.tone(220, "square", 0.12, true, -50), 40);
        setTimeout(() => this.tone(350, "triangle", 0.1, true, 100), 90);
        break;
      case "powerup":
        [400, 550, 700, 950].forEach((f, i) => setTimeout(() => this.tone(f, "sine", 0.12, true, 50), i * 60));
        break;
      case "laser": this.tone(960, "sawtooth", 0.06, true, -400); break;
      case "lost_ball":
        this.tone(180, "sawtooth", 0.25, true, -120);
        setTimeout(() => this.tone(100, "square", 0.35, true, -80), 80);
        setTimeout(() => this.tone(60, "sawtooth", 0.4, true, -40), 160);
        break;
      case "gameover":
        this.tone(280, "sawtooth", 0.3, true, -100);
        setTimeout(() => this.tone(210, "sawtooth", 0.3, true, -80), 220);
        setTimeout(() => this.tone(130, "sawtooth", 0.6, true, -50), 450);
        break;
      case "clear":
        [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => setTimeout(() => this.tone(f, "triangle", 0.2, true, 0), i * 100));
        break;
    }
  }
  startBGM() {
    this.init();
    if (!this.ctx || this.playingBGM) return;
    this.playingBGM = true;
    const melody = [261.63, 293.66, 329.63, 349.23, 392.00, 349.23, 329.63, 293.66];
    this.bgmInterval = setInterval(() => {
      if (!this.ctx || this.ctx.state === "suspended") return;
      const freq = melody[this.bgmStep % melody.length];
      this.tone(freq / 2, "square", 0.18, false);
      this.bgmStep++;
    }, 250);
  }
  stopBGM() {
    if (this.bgmInterval) { clearInterval(this.bgmInterval); this.bgmInterval = null; }
    this.playingBGM = false;
  }
}
const sound = new SoundEngine();

function loadGameData() {
  const saved = localStorage.getItem(SAVE_KEY);
  if (!saved) { updateHomeHUD(); return; }
  try {
    const data = JSON.parse(saved);
    state.highScore = Number(data.highScore) || 0;
    state.unlockedStage = Math.min(TOTAL_STAGES, Math.max(1, Number(data.unlockedStage) || 1));
    state.clearedCount = Number(data.clearedCount) || 0;
    if (data.bgmVol !== undefined) { sound.bgmVolume = Number(data.bgmVol); DOM.sliderBgm.value = Math.round(sound.bgmVolume * 100); }
    if (data.seVol !== undefined) { sound.seVolume = Number(data.seVol); DOM.sliderSe.value = Math.round(sound.seVolume * 100); }
    DOM.shake.checked = data.shake !== false;
  } catch (e) { console.warn("Save load error:", e); }
  updateVolumeLabels();
  updateHomeHUD();
}
function saveGameData() {
  const data = { highScore: state.highScore, unlockedStage: state.unlockedStage, clearedCount: state.clearedCount, bgmVol: sound.bgmVolume, seVol: sound.seVolume, shake: DOM.shake.checked };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}
function updateHomeHUD() {
  DOM.highScore.textContent = state.highScore;
  DOM.unlocked.textContent = `${state.unlockedStage}/${TOTAL_STAGES}`;
  DOM.clearedCount.textContent = state.clearedCount;
}
function updateVolumeLabels() {
  DOM.bgmValue.textContent = `${DOM.sliderBgm.value}%`;
  DOM.seValue.textContent = `${DOM.sliderSe.value}%`;
}
function renderStageGrid() {
  DOM.stageGrid.innerHTML = "";
  for (let stage = 1; stage <= TOTAL_STAGES; stage++) {
    const config = STAGES[stage];
    const locked = stage > state.unlockedStage;
    const cleared = stage < state.unlockedStage || (stage === TOTAL_STAGES && state.clearedCount > 0);
    const card = document.createElement("div");
    card.className = "stage-card";
    if (locked) card.classList.add("locked");
    if (cleared) card.classList.add("cleared");
    const badge = locked ? "🔒 ロック" : cleared ? "★ クリア済" : "挑戦可能";
    card.innerHTML = `<div class="stage-badge">${badge}</div><div class="stage-num">${stage}</div><div class="stage-name">${config.name}</div><div class="stage-description">${config.description}</div>`;
    if (!locked) {
      card.addEventListener("click", () => { sound.init(); startStage(stage); });
    }
    DOM.stageGrid.appendChild(card);
  }
}
function showGameScreen() { DOM.home.classList.remove("active"); DOM.game.classList.add("active"); DOM.hud.style.display = "flex"; }
function showHomeScreen() { DOM.game.classList.remove("active"); DOM.home.classList.add("active"); DOM.hud.style.display = "none"; renderStageGrid(); updateHomeHUD(); }

function createBrick(stage, row, col) {
  let type = "normal"; let hp = 1; let color = COLORS.blue;
  switch (stage) {
    case 1: type = "normal"; hp = 1; color = COLORS.blue; break;
    case 2:
      type = (row % 2 === 1) ? "durable" : "normal";
      hp = (type === "durable") ? 2 : 1;
      color = (type === "durable") ? COLORS.pink : COLORS.blue;
      break;
    case 3:
      type = ((row + col) % 3 === 0) ? "speed" : "normal";
      color = (type === "speed") ? COLORS.yellow : COLORS.blue;
      break;
    case 4:
      if (row === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (row === 1) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 5: {
      const centerCol = 4; const dist = Math.abs(col - centerCol);
      if (row >= dist) {
        if (row === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
        else if (row <= 2) { type = "durable"; hp = 2; color = COLORS.pink; }
        else { type = "normal"; hp = 1; color = COLORS.accent; }
      } else { return null; }
      break;
    }
    case 6:
      type = ((row + col) % 2 === 0) ? "speed" : "durable";
      hp = (type === "durable") ? 2 : 1;
      color = (type === "durable") ? COLORS.pink : COLORS.yellow;
      break;
    case 7:
      if (row % 2 === 0 && col % 2 === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (row % 2 === 1) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 8:
      if (col === 2 || col === 6) { type = "speed"; color = COLORS.yellow; }
      else if (row === 0 || row === 5) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "hardcore"; hp = 3; color = COLORS.purple; }
      break;
    case 9:
      if (col === 0 || col === 4 || col === 8) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (row % 2 === 0) { type = "speed"; color = COLORS.yellow; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 10: {
      const pattern = (row * 9 + col) % 4;
      if (pattern === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (pattern === 1) { type = "durable"; hp = 2; color = COLORS.pink; }
      else if (pattern === 2) { type = "speed"; color = COLORS.yellow; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    }
    case 11: {
      const rand = Math.random();
      if (rand < 0.25) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (rand < 0.5) { type = "durable"; hp = 2; color = COLORS.pink; }
      else if (rand < 0.75) { type = "speed"; color = COLORS.yellow; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    }
    case 12:
      if (row === 0 || row === 4) { type = "gold"; hp = 1; color = COLORS.gold; }
      else if (col === 0 || col === 8) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 13:
      if ((row + col) % 4 === 0) { type = "speed"; color = COLORS.yellow; }
      else if (row === 2) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else { type = "normal"; hp = 1; color = COLORS.accent; }
      break;
    case 14:
      if (col % 2 === 0) { type = "gold"; hp = 1; color = COLORS.gold; }
      else { type = "durable"; hp = 2; color = COLORS.pink; }
      break;
    case 15:
      if ((row + col) % 5 === 0) { type = "blind"; hp = 1; color = COLORS.dark; }
      else if (row < 3) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 16:
      if (row === 2 || row === 3) { type = "gold"; hp = 1; color = COLORS.gold; }
      else { type = "speed"; color = COLORS.yellow; }
      break;
    case 17:
      if ((row * col) % 3 === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if ((row + col) % 2 === 0) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "normal"; hp = 1; color = COLORS.blue; }
      break;
    case 18:
      if (row === 0 || row === 5) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (col === 0 || col === 4 || col === 8) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "gold"; hp = 1; color = COLORS.gold; }
      break;
    case 19:
      if ((row + col) % 3 === 0) { type = "gold"; hp = 1; color = COLORS.gold; }
      else if (row % 2 === 0) { type = "speed"; color = COLORS.yellow; }
      else { type = "hardcore"; hp = 3; color = COLORS.purple; }
      break;
    case 20: {
      const v = (row + col) % 5;
      if (v === 0) { type = "hardcore"; hp = 3; color = COLORS.purple; }
      else if (v === 1) { type = "gold"; hp = 1; color = COLORS.gold; }
      else if (v === 2) { type = "blind"; hp = 1; color = COLORS.dark; }
      else if (v === 3) { type = "durable"; hp = 2; color = COLORS.pink; }
      else { type = "speed"; color = COLORS.yellow; }
      break;
    }
    default: type = "normal"; hp = 1; color = COLORS.blue;
  }
  const width = 74; const height = 22; const padding = 10; const offsetTop = 80; const offsetLeft = 28;
  return { x: offsetLeft + col * (width + padding), y: offsetTop + row * (height + padding), width, height, type, hp, maxHp: hp, color, alive: true, hitAnim: 0 };
}

function createLevelBricks(stage) {
  const config = STAGES[stage];
  const result = [];
  for (let row = 0; row < config.rows; row++) {
    for (let col = 0; col < config.cols; col++) {
      const brick = createBrick(stage, row, col);
      if (brick !== null) result.push(brick);
    }
  }
  if (result.length === 0) result.push(createBrick(1, 0, 0));
  return result;
}

function resetBall() {
  balls = [{ x: 400, y: 540, vx: 4, vy: -5, radius: 8, speedMultiplier: 1 }];
  stickyBall = true;
}

function startStage(stage) {
  state.currentStage = stage;
  state.score = 0;
  state.lives = 3;
  state.playing = true;
  state.paused = false;
  state.screenShake = 0;
  state.blindTimer = 0;
  state.flashTimer = 0;
  paddle.width = paddle.baseWidth;
  paddle.laserTimer = 0;
  activeBuffs.expand = 0;
  activeBuffs.laser = 0;
  bricks = createLevelBricks(stage);
  items = [];
  particles = [];
  floatingTexts = [];
  lasers = [];
  resetBall();
  input.left = false;
  input.right = false;
  input.keyboardActive = false;
  showGameScreen();
  sound.startBGM();
}

function createExplosion(x, y, color, count = 16, isHard = false) {
  const speedFactor = isHard ? 9 : 6;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * speedFactor + 2;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius: Math.random() * 4 + 2,
      color,
      alpha: 1,
      decay: Math.random() * 0.02 + 0.015,
      shape: Math.random() > 0.5 ? "circle" : "rect"
    });
  }
  particles.push({ x, y, vx: 0, vy: 0, radius: 5, maxRadius: isHard ? 60 : 35, color: "#ffffff", alpha: 0.8, decay: 0.08, isRing: true });
}

function addFloatingText(x, y, text, color = COLORS.accent) {
  floatingTexts.push({ x, y, text, color, alpha: 1, vy: -1.5 });
}

function dropItem(x, y) {
  if (Math.random() >= 0.25) return;
  const types = ["expand", "multiball", "laser"];
  const type = types[Math.floor(Math.random() * types.length)];
  const colors = { expand: "#00ff00", multiball: COLORS.blue, laser: COLORS.danger };
  items.push({ x: x - 8, y, type, color: colors[type], speed: 150, width: 16, height: 16 });
}

function applyPowerUp(type) {
  state.score += 50;
  sound.playSE("powerup");
  addFloatingText(GAME_WIDTH / 2, 300, "+50 SCORE!", COLORS.accent);
  switch (type) {
    case "expand":
      paddle.width = paddle.baseWidth * 1.5;
      activeBuffs.expand = 8000;
      activeBuffs.expandMax = 8000;
      break;
    case "multiball":
      if (balls.length > 0) {
        const base = balls[0];
        balls.push({ x: base.x, y: base.y, vx: -base.vx - 1, vy: base.vy, radius: 8, speedMultiplier: base.speedMultiplier });
        balls.push({ x: base.x, y: base.y, vx: base.vx + 1, vy: base.vy * 0.9, radius: 8, speedMultiplier: base.speedMultiplier });
      }
      break;
    case "laser":
      paddle.laserTimer = 6000;
      activeBuffs.laser = 6000;
      activeBuffs.laserMax = 6000;
      break;
  }
}

function damageBrick(brick) {
  brick.hp--;
  brick.hitAnim = 1.0;
  const pts = (brick.type === "gold" ? 300 : 10);
  state.score += pts;
  addFloatingText(brick.x + brick.width / 2, brick.y, `+${pts}`, brick.color);

  if (brick.hp > 0) {
    if (brick.hp === 2) brick.color = COLORS.pink;
    else if (brick.hp === 1) brick.color = COLORS.blue;
    sound.playSE("bounce");
    if (DOM.shake.checked) state.screenShake = 2;
    return;
  }

  brick.alive = false;
  const isHard = (brick.type === "hardcore" || brick.type === "durable");
  createExplosion(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color, isHard ? 22 : 14, isHard);
  if (DOM.shake.checked) state.screenShake = isHard ? 7 : 4;
  sound.playSE(isHard ? "break_hard" : "break");

  if (brick.type === "speed") {
    balls.forEach(ball => {
      ball.speedMultiplier = 1.6;
      setTimeout(() => { if (ball) ball.speedMultiplier = 1; }, 4000);
    });
    addFloatingText(brick.x + brick.width / 2, brick.y - 15, "SPEED UP!!", COLORS.yellow);
  }
  if (brick.type === "blind") {
    state.blindTimer = 3500;
  }
  dropItem(brick.x + brick.width / 2, brick.y + brick.height / 2);
}

function allBricksDestroyed() { return !bricks.some(brick => brick.alive); }

function updatePaddle(delta) {
  if (input.keyboardActive) {
    if (input.left) paddle.x -= paddle.speed * delta;
    if (input.right) paddle.x += paddle.speed * delta;
  } else if (input.pointerActive) {
    const scale = GAME_WIDTH / DOM.canvas.clientWidth;
    paddle.x = input.pointerX * scale - paddle.width / 2;
  }
  paddle.x = Math.max(0, Math.min(GAME_WIDTH - paddle.width, paddle.x));
}

function updateBalls(delta) {
  for (let i = balls.length - 1; i >= 0; i--) {
    const ball = balls[i];
    if (stickyBall && i === 0) continue;
    const multiplier = ball.speedMultiplier;
    ball.x += ball.vx * multiplier * delta * 60;
    ball.y += ball.vy * multiplier * delta * 60;

    particles.push({
      x: ball.x, y: ball.y,
      vx: 0, vy: 0,
      radius: ball.radius * (0.7 + multiplier * 0.15),
      color: multiplier > 1.2 ? COLORS.yellow : COLORS.accent,
      alpha: 0.5,
      decay: 0.06 * multiplier,
      shape: "circle"
    });

    if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -1; sound.playSE("bounce"); }
    if (ball.x + ball.radius > GAME_WIDTH) { ball.x = GAME_WIDTH - ball.radius; ball.vx *= -1; sound.playSE("bounce"); }
    if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.vy *= -1; sound.playSE("bounce"); }

    if (ball.y - ball.radius > GAME_HEIGHT) {
      balls.splice(i, 1);
      if (balls.length === 0 && !stickyBall) {
        createExplosion(ball.x, GAME_HEIGHT - 10, COLORS.danger, 25, true);
        sound.playSE("lost_ball");
        state.lives--;
        state.flashTimer = 0.5;
        if (DOM.shake.checked) state.screenShake = 9;
        addFloatingText(GAME_WIDTH / 2, GAME_HEIGHT - 60, "- LOST LIFE -", COLORS.danger);
        if (state.lives <= 0) { finishGame(false); return; }
      } else {
        sound.playSE("lost_ball");
      }
      continue;
    }

    if (ball.vy > 0 && ball.x > paddle.x && ball.x < paddle.x + paddle.width && ball.y + ball.radius > paddle.y && ball.y - ball.radius < paddle.y + paddle.height) {
      ball.y = paddle.y - ball.radius;
      const relative = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
      const currentSpeed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
      ball.vx = relative * 5.5;
      const vertical = Math.sqrt(Math.max(1, currentSpeed ** 2 - ball.vx ** 2));
      ball.vy = -vertical;
      sound.playSE("paddle");
    }

    for (const brick of bricks) {
      if (!brick.alive) continue;
      const collision = ball.x + ball.radius > brick.x && ball.x - ball.radius < brick.x + brick.width && ball.y + ball.radius > brick.y && ball.y - ball.radius < brick.y + brick.height;
      if (!collision) continue;
      const previousX = ball.x - ball.vx * multiplier;
      const previousY = ball.y - ball.vy * multiplier;
      if (previousX + ball.radius <= brick.x || previousX - ball.radius >= brick.x + brick.width) { ball.vx *= -1; } else { ball.vy *= -1; }
      damageBrick(brick);
      break;
    }
  }
}

function updateLasers(delta) {
  if (paddle.laserTimer > 0) {
    paddle.laserTimer -= delta * 1000;
    if (Math.floor(paddle.laserTimer) % 300 < delta * 1000) {
      lasers.push({ x: paddle.x + 10, y: paddle.y, vy: -480 });
      lasers.push({ x: paddle.x + paddle.width - 10, y: paddle.y, vy: -480 });
      sound.playSE("laser");
    }
  }
  if (activeBuffs.expand > 0) {
    activeBuffs.expand -= delta * 1000;
    if (activeBuffs.expand <= 0) paddle.width = paddle.baseWidth;
  }
  if (activeBuffs.laser > 0) activeBuffs.laser -= delta * 1000;

  for (let i = lasers.length - 1; i >= 0; i--) {
    const laser = lasers[i];
    laser.y += laser.vy * delta;
    if (laser.y < 0 || laser.y > GAME_HEIGHT) { lasers.splice(i, 1); continue; }
    for (const brick of bricks) {
      if (!brick.alive) continue;
      const hit = laser.x > brick.x && laser.x < brick.x + brick.width && laser.y > brick.y && laser.y < brick.y + brick.height;
      if (hit) { damageBrick(brick); lasers.splice(i, 1); break; }
    }
  }
}

function updateItems(delta) {
  for (let i = items.length - 1; i >= 0; i--) {
    const item = items[i];
    item.y += item.speed * delta;
    if (item.y > GAME_HEIGHT) { items.splice(i, 1); continue; }
    const caught = item.y + item.height > paddle.y && item.x + item.width > paddle.x && item.x < paddle.x + paddle.width;
    if (caught) { applyPowerUp(item.type); items.splice(i, 1); }
  }
}

function updateParticles(delta) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * delta * 60;
    p.y += p.vy * delta * 60;
    p.alpha -= p.decay * delta * 60;
    if (p.isRing) p.radius += (p.maxRadius - p.radius) * 0.2 * delta * 60;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const ft = floatingTexts[i];
    ft.y += ft.vy * delta * 60;
    ft.alpha -= 0.02 * delta * 60;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }
  for (const brick of bricks) {
    if (brick.hitAnim > 0) brick.hitAnim -= delta * 5;
  }
}

function update(delta) {
  if (!state.playing || state.paused) return;
  if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - delta * 12);
  if (state.blindTimer > 0) state.blindTimer -= delta * 1000;
  if (state.flashTimer > 0) state.flashTimer -= delta;
  updatePaddle(delta);
  if (stickyBall && balls.length > 0) { balls[0].x = paddle.x + paddle.width / 2; balls[0].y = paddle.y - balls[0].radius; }
  updateLasers(delta);
  updateBalls(delta);
  updateItems(delta);
  updateParticles(delta);

  if (balls.length === 0 && !stickyBall && state.lives > 0) {
    paddle.width = paddle.baseWidth;
    paddle.laserTimer = 0;
    activeBuffs.expand = 0;
    activeBuffs.laser = 0;
    resetBall();
  }
  if (allBricksDestroyed()) finishGame(true);
}

function finishGame(won) {
  if (!state.playing) return;
  state.playing = false;
  state.paused = false;
  sound.stopBGM();
  if (state.score > state.highScore) state.highScore = state.score;
  if (won) {
    sound.playSE("clear");
    DOM.resultTitle.textContent = "STAGE CLEAR!";
    DOM.resultTitle.style.color = COLORS.accent;
    DOM.resultText.innerHTML = `おめでとうございます！<br>ステージ ${state.currentStage} を突破しました。<br><br>獲得スコア:<span class="highlight">${state.score}</span>`;
    if (state.currentStage === state.unlockedStage && state.unlockedStage < TOTAL_STAGES) state.unlockedStage++;
    if (state.currentStage === TOTAL_STAGES) state.clearedCount++;
    if (state.currentStage < TOTAL_STAGES) {
      DOM.resultAction.style.display = "block";
      DOM.resultAction.textContent = "次のステージへ";
    } else {
      DOM.resultAction.style.display = "none";
    }
  } else {
    sound.playSE("gameover");
    DOM.resultTitle.textContent = "GAME OVER";
    DOM.resultTitle.style.color = COLORS.danger;
    DOM.resultText.innerHTML = `パドルが破壊されました。<br><br>最終スコア:<span class="highlight">${state.score}</span>`;
    DOM.resultAction.style.display = "block";
    DOM.resultAction.textContent = "もう一度挑戦";
  }
  saveGameData();
  updateHomeHUD();
  DOM.resultModal.classList.add("active");
}

function setPaused(paused) {
  if (!state.playing) return;
  state.paused = paused;
  if (paused) {
    sound.stopBGM();
    DOM.pauseModal.classList.add("active");
  } else {
    DOM.pauseModal.classList.remove("active");
    DOM.configModal.classList.remove("active");
    sound.startBGM();
  }
}

function drawBricks() {
  for (const brick of bricks) {
    if (!brick.alive) continue;
    ctx.save();
    if (brick.hitAnim > 0) {
      ctx.translate(brick.x + brick.width / 2, brick.y + brick.height / 2);
      const scale = 1 + brick.hitAnim * 0.15;
      ctx.scale(scale, scale);
      ctx.translate(-(brick.x + brick.width / 2), -(brick.y + brick.height / 2));
    }
    ctx.fillStyle = brick.color;
    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);

    if (brick.hp > 1) {
      ctx.fillStyle = "rgba(0,0,0,0.35)";
      ctx.font = "bold 10px 'Courier New'";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(`${brick.hp}`, brick.x + brick.width / 2, brick.y + brick.height / 2);
    }
    ctx.restore();
  }
}

function drawPaddle() {
  ctx.fillStyle = paddle.laserTimer > 0 ? COLORS.danger : COLORS.white;
  ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
  ctx.fillStyle = COLORS.accent;
  ctx.fillRect(paddle.x + 4, paddle.y + 3, paddle.width - 8, 3);
  if (paddle.laserTimer > 0) {
    ctx.fillStyle = COLORS.danger;
    ctx.fillRect(paddle.x, paddle.y - 6, 6, 8);
    ctx.fillRect(paddle.x + paddle.width - 6, paddle.y - 6, 6, 8);
  }
}

function drawBalls() {
  ctx.fillStyle = COLORS.white;
  for (const ball of balls) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawLasers() {
  ctx.fillStyle = COLORS.danger;
  for (const laser of lasers) { ctx.fillRect(laser.x - 1, laser.y, 3, 12); }
}

function drawItems() {
  for (const item of items) {
    ctx.fillStyle = item.color;
    ctx.fillRect(item.x, item.y, item.width, item.height);
    ctx.strokeStyle = COLORS.white;
    ctx.lineWidth = 1;
    ctx.strokeRect(item.x, item.y, item.width, item.height);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    if (p.isRing) {
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.color;
      if (p.shape === "rect") {
        ctx.fillRect(p.x - p.radius, p.y - p.radius, p.radius * 2, p.radius * 2);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  for (const ft of floatingTexts) {
    ctx.save();
    ctx.globalAlpha = ft.alpha;
    ctx.fillStyle = ft.color;
    ctx.font = "bold 14px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = COLORS.white;
  ctx.font = "14px 'Courier New'";
  ctx.textAlign = "left";
  ctx.fillText(`STAGE: ${state.currentStage}`, 25, 30);
  ctx.fillText(`SCORE: ${state.score}`, 150, 30);
  ctx.fillText("LIVES:", 580, 30);
  for (let i = 0; i < 3; i++) {
    ctx.fillStyle = i < state.lives ? COLORS.accent : "#2d3142";
    ctx.fillRect(640 + i * 18, 18, 12, 14);
  }

  let buffY = 55;
  if (activeBuffs.expand > 0) {
    drawBuffStatus("EXPAND", activeBuffs.expand, activeBuffs.expandMax, "#00ff00", buffY);
    buffY += 22;
  }
  if (activeBuffs.laser > 0) {
    drawBuffStatus("LASER", activeBuffs.laser, activeBuffs.laserMax, COLORS.danger, buffY);
    buffY += 22;
  }
  if (balls.length > 1) {
    drawBuffStatus(`BALLS x${balls.length}`, 1, 1, COLORS.blue, buffY);
  }
}

function drawBuffStatus(name, current, max, color, yPos) {
  const boxWidth = 110;
  const boxHeight = 16;
  const boxX = GAME_WIDTH - boxWidth - 25;
  ctx.fillStyle = "rgba(26,28,41,0.85)";
  ctx.fillRect(boxX, yPos, boxWidth, boxHeight);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.strokeRect(boxX, yPos, boxWidth, boxHeight);

  if (max > 1) {
    const ratio = Math.max(0, Math.min(1, current / max));
    ctx.fillStyle = color;
    ctx.fillRect(boxX, yPos, boxWidth * ratio, boxHeight);
  }

  ctx.fillStyle = COLORS.white;
  ctx.font = "10px 'Courier New'";
  ctx.textAlign = "center";
  ctx.fillText(`${name}`, boxX + boxWidth / 2, yPos + 12);
  ctx.textAlign = "left";
}

function drawInstructions() {
  if (!stickyBall || !state.playing) return;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.font = "16px 'Courier New'";
  ctx.textAlign = "center";
  const isMobileMatch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  if (isMobileMatch) {
    ctx.fillText("「発射」ボタンをタップしてボールを発射", GAME_WIDTH / 2, 400);
  } else {
    ctx.fillText("クリック / スペースキーでボールを発射", GAME_WIDTH / 2, 400);
  }
  ctx.textAlign = "left";
}

function draw() {
  ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  ctx.save();
  if (state.screenShake > 0) {
    const dx = (Math.random() - 0.5) * state.screenShake * 1.5;
    const dy = (Math.random() - 0.5) * state.screenShake * 1.5;
    ctx.translate(dx, dy);
  }
  drawBricks();
  drawPaddle();
  drawLasers();
  drawBalls();
  drawItems();
  drawParticles();
  drawHUD();
  drawInstructions();

  if (state.flashTimer > 0) {
    ctx.fillStyle = `rgba(255,74,90,${state.flashTimer * 1.2})`;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  }

  if (state.blindTimer > 0) {
    ctx.fillStyle = "rgba(0,0,0,0.85)";
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
    ctx.fillStyle = COLORS.accent;
    ctx.font = "18px 'Courier New'";
    ctx.textAlign = "center";
    ctx.fillText("【ブラインド発動中】視界不良！", GAME_WIDTH / 2, 300);
    ctx.textAlign = "left";
  }
  ctx.restore();
}

function gameLoop(timestamp) {
  if (!state.lastTime) { state.lastTime = timestamp; }
  let delta = (timestamp - state.lastTime) / 1000;
  state.lastTime = timestamp;
  delta = Math.min(delta, 0.033);

  update(delta);
  draw();
  requestAnimationFrame(gameLoop);
}

function checkOrientation() {
  const warning = $("rotate-warning");
  if (window.innerHeight > window.innerWidth && window.innerWidth <= 820) {
    warning.classList.add("show");
  } else {
    warning.classList.remove("show");
  }
}

window.addEventListener("resize", checkOrientation);
window.addEventListener("load", () => {
  checkOrientation();
  loadGameData();
  renderStageGrid();
  updateVolumeLabels();
  requestAnimationFrame(gameLoop);
});

window.addEventListener("keydown", event => {
  const key = event.key.toLowerCase();
  if (["arrowleft", "arrowright", "a", "d", " ", "escape", "p"].includes(key)) { event.preventDefault(); }
  if (key === "arrowleft" || key === "a") { input.left = true; input.keyboardActive = true; }
  if (key === "arrowright" || key === "d") { input.right = true; input.keyboardActive = true; }
  if (key === " " && state.playing && !state.paused && stickyBall) { launchBall(); }
  if (key === "escape" || key === "p") {
    if (state.playing && !DOM.resultModal.classList.contains("active") && !DOM.configModal.classList.contains("active")) {
      setPaused(!state.paused);
    }
  }
});
window.addEventListener("keyup", event => {
  const key = event.key.toLowerCase();
  if (key === "arrowleft" || key === "a") { input.left = false; }
  if (key === "arrowright" || key === "d") { input.right = false; }
});

function updatePointerPosition(event) {
  const rect = DOM.canvas.getBoundingClientRect();
  let x = event.clientX - rect.left;
  x = Math.max(0, Math.min(rect.width, x));
  input.pointerX = (x / rect.width) * GAME_WIDTH;
  input.pointerActive = true;
  input.keyboardActive = false;
}

DOM.canvas.addEventListener("pointerdown", event => {
  event.preventDefault();
  updatePointerPosition(event);
  try { DOM.canvas.setPointerCapture(event.pointerId); } catch (_) {}
});
DOM.canvas.addEventListener("pointermove", event => {
  event.preventDefault();
  if (input.pointerActive) updatePointerPosition(event);
});
DOM.canvas.addEventListener("pointerup", event => {
  event.preventDefault();
  input.pointerActive = false;
});
DOM.canvas.addEventListener("pointercancel", () => { input.pointerActive = false; });

function launchBall() {
  if (!state.playing || state.paused || !stickyBall) return;
  sound.init();
  stickyBall = false;
  sound.playSE("paddle");
}

$("btn-launch-mobile").addEventListener("pointerdown", event => {
  event.stopPropagation();
  if (state.playing && !state.paused && stickyBall) {
    launchBall();
  }
});

$("btn-hud-pause").addEventListener("click", () => { setPaused(!state.paused); });
$("btn-hud-config").addEventListener("click", () => { state.configSource = "game"; setPaused(true); DOM.pauseModal.classList.remove("active"); DOM.configModal.classList.add("active"); });
$("btn-home-config").addEventListener("click", () => { sound.init(); state.configSource = "home"; DOM.configModal.classList.add("active"); });
$("btn-config-close").addEventListener("click", () => { DOM.configModal.classList.remove("active"); saveGameData(); if (state.configSource === "game") { setPaused(false); } else { updateHomeHUD(); renderStageGrid(); } });
$("btn-pause-resume").addEventListener("click", () => { setPaused(false); });
$("btn-pause-retire").addEventListener("click", () => { DOM.pauseModal.classList.remove("active"); finishGame(false); });
DOM.resultAction.addEventListener("click", () => {
  DOM.resultModal.classList.remove("active");
  if (DOM.resultAction.textContent === "もう一度挑戦") {
    startStage(state.currentStage);
  } else {
    startStage(state.currentStage + 1);
  }
});
$("btn-result-home").addEventListener("click", () => { DOM.resultModal.classList.remove("active"); showHomeScreen(); });

$("btn-reset-data").addEventListener("click", () => {
  const confirmed = confirm("ゲームデータを初期化してよろしいですか？\n\nすべてのステージ進行状況がリセットされます。");
  if (!confirmed) return;
  localStorage.removeItem(SAVE_KEY);
  state.highScore = 0;
  state.unlockedStage = 1;
  state.clearedCount = 0;
  sound.bgmVolume = 0.5;
  sound.seVolume = 0.7;
  DOM.sliderBgm.value = 50;
  DOM.sliderSe.value = 70;
  DOM.shake.checked = true;
  updateVolumeLabels();
  saveGameData();
  updateHomeHUD();
  renderStageGrid();
});

DOM.sliderBgm.addEventListener("input", () => {
  sound.setBGMVolume(Number(DOM.sliderBgm.value) / 100);
  DOM.bgmValue.textContent = `${DOM.sliderBgm.value}%`;
});
DOM.sliderSe.addEventListener("input", () => {
  sound.setSEVolume(Number(DOM.sliderSe.value) / 100);
  DOM.seValue.textContent = `${DOM.sliderSe.value}%`;
});
</script>
</body>
</html>
